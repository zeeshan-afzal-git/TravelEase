name: Release CSS Lint

on:
  push:
    branches: [release]
  pull_request:
    branches: [release]

jobs:
  css-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Stylelint
        run: npm install -g stylelint stylelint-config-standard
      - name: Lint CSS Files
        run: stylelint "**/*.css"
